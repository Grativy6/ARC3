minimum_pre_commit_version: "4.0.0"
fail_fast: false

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff lint
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: mypy-strict
        name: mypy strict first-party code
        entry: mypy src agent scripts
        language: system
        pass_filenames: false
        types: [python]
