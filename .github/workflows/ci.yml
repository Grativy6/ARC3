name: ARC3 CI

"on":
  push:
    branches:
      - main
      - "build/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: "arc3-ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12.14

      - name: Synchronize locked environment
        run: uv sync --locked --all-extras --dev --python 3.12.14

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Strict type check
        run: uv run mypy src agent scripts

      - name: Test with coverage
        run: uv run pytest -q --cov-report=xml

      - name: Runtime doctor
        run: uv run arc3 doctor
